name: Build Winland Saga APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          mkdir project
          unzip -q winland_saga_step1.zip -d project

      - name: Find Flutter project
        run: |
          PUBSPEC=$(find project -name pubspec.yaml -print -quit)
          if [ -z "$PUBSPEC" ]; then
            echo "pubspec.yaml not found"
            exit 1
          fi
          echo "PUBSPEC=$PUBSPEC" >> $GITHUB_ENV
          echo "Flutter project found at: $(dirname "$PUBSPEC")"

      - name: Set Flutter project directory
        run: |
          PROJECT_DIR=$(dirname "$PUBSPEC")
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Prepare Android project
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          flutter pub get
          flutter create . --platforms=android
          
      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: winland-saga-apk
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk
